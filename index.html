<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Drive — ПДД по миру</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f0;color:#172923;font:16px/1.5 system-ui,sans-serif}button,select{font:inherit}button{cursor:pointer}header{max-width:1040px;margin:auto;padding:22px 24px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:850;letter-spacing:-1px}.brand span{color:#438063}.tag{font-size:12px;color:#60736a;letter-spacing:1px;text-transform:uppercase}main{max-width:1040px;margin:auto;padding:12px 24px 48px}h1,h2,p{margin:0}h1{font-size:clamp(28px,5vw,48px);line-height:1.12;letter-spacing:-1.8px}h2{font-size:clamp(21px,3vw,28px);line-height:1.25;letter-spacing:-.6px}.sub{color:#64766c;margin:10px 0 24px}.countries{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.country{background:white;border:1px solid #dce2db;border-radius:12px;padding:10px 18px;font-weight:650}.country.active{background:#203c31;color:white;border-color:#203c31}.stats{display:flex;gap:16px;align-items:center;font-size:13px;color:#50675a;flex-wrap:wrap}.track{flex:1;min-width:80px;height:7px;border-radius:20px;background:#dce5dc;overflow:hidden}.fill{height:100%;background:#43966c;transition:width .3s}.game{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;margin-top:18px;align-items:start}.scene{border-radius:22px;overflow:hidden;background:#dce7d6;position:relative}.scene svg{width:100%;display:block;height:auto}.legend{position:absolute;left:14px;top:14px;background:#fffef4e8;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700}.panel{border:1px solid #e1e5df;background:#fff;border-radius:22px;padding:24px;min-width:0}.topic{color:#63796c;font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}.desc{color:#54665c;margin:12px 0 20px}.answers{display:grid;gap:9px}.answer{display:flex;align-items:center;text-align:left;width:100%;background:#fff;border:1px solid #dce3db;border-radius:12px;padding:12px;gap:12px;color:inherit;min-height:54px}.answer:hover:not(:disabled){border-color:#438063;background:#f1f8f1}.answer:disabled{cursor:default}.letter{display:grid;place-items:center;flex:none;width:29px;height:29px;border-radius:8px;background:#edf1eb;font-size:13px;font-weight:750}.answer.ok{background:#e6f4e8;border-color:#5c9b69}.answer.bad{background:#fcece7;border-color:#d28a7a}.feedback{margin-top:16px;border-radius:12px;padding:14px;background:#eef4ec;font-size:14px}.feedback.bad{background:#fff2e9}.feedback strong{display:block;margin-bottom:4px}.next,.primary{margin-top:16px;border:0;background:#214637;color:white;border-radius:12px;width:100%;padding:14px;font-weight:750}.next:hover,.primary:hover{background:#32634c}.foot{display:flex;justify-content:space-between;gap:10px;color:#748176;font-size:12px;margin-top:20px;flex-wrap:wrap}a{color:inherit}.reset{border:0;background:none;color:#68796f;text-decoration:underline;padding:0}.end{max-width:480px;margin:30px auto;text-align:center}.big{font-size:64px;color:#347a53;font-weight:850;letter-spacing:-4px}.hidden{display:none!important}.route{stroke-dasharray:9 8;animation:flow .8s linear infinite}@keyframes flow{to{stroke-dashoffset:-34}}@media(max-width:720px){header{padding:16px}main{padding:12px 16px 30px}.game{grid-template-columns:1fr;gap:12px}.panel{padding:19px}.scene{border-radius:16px}.scene svg{max-height:360px}.country{padding:9px 12px}.tag{font-size:10px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<header><div class="brand">world<span>drive</span>.</div><div class="tag">Дорожный тренажёр · MVP</div></header>
<main><section id="intro"><h1>На дорогах мира.</h1><p class="sub">Учись принимать правильные решения за рулём в разных странах.</p><div class="countries" id="countries" aria-label="Выбор страны"></div></section>
<div id="play"><div class="stats"><span id="count"></span><div class="track" role="progressbar" aria-label="Прогресс"><div class="fill" id="fill"></div></div><span id="score"></span></div>
<div class="game"><div class="scene"><div class="legend" id="legend">Синяя машина — вы</div><div id="diagram"></div></div><section class="panel"><div class="topic" id="topic"></div><h2 id="question"></h2><p class="desc" id="desc"></p><div class="answers" id="answers"></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><button class="next hidden" id="next">Продолжить →</button></section></div></div>
<section class="panel end hidden" id="end"><div class="topic">Маршрут завершён</div><div class="big" id="result"></div><h2>Отличная практика!</h2><p class="sub" id="endText"></p><button class="primary" id="again">Пройти ещё раз</button></section>
<div class="foot"><span>Учебные упрощённые схемы. Не заменяют официальные ПДД.</span><button class="reset" id="reset">Сбросить прогресс</button></div></main>
<script>
'use strict';
const countries=[{id:'ge',label:'🇬🇪 Грузия',side:'right',source:'https://matsne.gov.ge/en/document/view/2169396'},{id:'de',label:'🇩🇪 Германия',side:'right',source:'https://www.gesetze-im-internet.de/stvo_2013/'},{id:'uk',label:'🇬🇧 Великобритания',side:'left',source:'https://www.gov.uk/guidance/the-highway-code'}];
const common=[
{topic:'Круговое движение',type:'round',q:'Кто проезжает первым?',d:'Вы подъезжаете к кругу. Перед вами знак «Уступите дорогу», а на круге уже движется красный автомобиль.',a:['Въехать первым','Уступить автомобилю на круге','Остановиться и ждать, даже если круг свободен'],correct:1,ex:'Знак требует уступить транспортным средствам, которым вы можете помешать. Въезжайте, когда появится безопасный промежуток.'},
{topic:'Перекрёстки',type:'stop',q:'Как проехать знак STOP?',d:'Вы подъехали к стоп-линии. Других машин не видно.',a:['Снизить скорость и проехать','Полностью остановиться, проверить дорогу и продолжить','Остановиться только при появлении другой машины'],correct:1,ex:'STOP требует полной остановки перед стоп-линией, даже когда другие машины отсутствуют.'},
{topic:'Пешеходы',type:'zebra',q:'Что делать перед переходом?',d:'Пешеход уже находится на обозначенном переходе перед вашим автомобилем.',a:['Уступить и дождаться безопасного проезда','Объехать пешехода','Подать сигнал и продолжить'],correct:0,ex:'Не создавайте опасности пешеходу. Уступите ему и продолжайте лишь тогда, когда это безопасно.'},
{topic:'Светофоры',type:'light',q:'Можно ли продолжить движение?',d:'Вам нужно прямо. Горит красный сигнал светофора, стоп-линия перед вами.',a:['Да, если перекрёсток пуст','Да, на малой скорости','Нет, остановиться перед линией'],correct:2,ex:'Красный сигнал запрещает движение прямо. Остановитесь перед стоп-линией.'},
{topic:'Дорожные знаки',type:'entry',q:'Что означает этот знак?',d:'Перед вами красный круг с белой горизонтальной полосой.',a:['Одностороннее движение','Въезд запрещён','Остановка запрещена'],correct:1,ex:'Знак запрещает въезжать с этой стороны. Выберите другой разрешённый маршрут.'},
{topic:'Сторона движения',type:'side',q:'Какую сторону дороги выбрать?',d:'Вы выезжаете на обычную двустороннюю дорогу без особых ограничений.',a:['Левую','Правую','Любую, если нет машин'],correct:1,ex:'На обычной двусторонней дороге придерживайтесь правой стороны.'}
];
const extra={
ge:[{topic:'Безопасность',type:'wet',q:'Как ехать по мокрой дороге?',d:'Начался сильный дождь. Видимость снизилась, впереди другая машина.',a:['Увеличить дистанцию и снизить скорость','Приблизиться к машине впереди','Сохранить скорость любой ценой'],correct:0,ex:'На мокром покрытии сцепление хуже. Увеличьте дистанцию и адаптируйте скорость к условиям.'}],
de:[{topic:'Автобан',type:'lanes',q:'Как поступить после обгона?',d:'Вы закончили обгон на автобане. Правая полоса свободна и перестроение безопасно.',a:['Остаться слева без необходимости','Вернуться на правую полосу','Остановиться на обочине'],correct:1,ex:'В Германии действует принцип движения справа. После обгона возвращайтесь вправо, когда это безопасно.'}],
uk:[{topic:'Круговое движение',type:'direction',q:'В какую сторону движется поток на круге?',d:'Перед вами обычное британское круговое движение.',a:['Против часовой стрелки','По часовой стрелке','В любую сторону'],correct:1,ex:'В Великобритании движение по обычному кругу идёт по часовой стрелке. Следуйте дорожным знакам и разметке.'}]
};
function questions(id){return common.map(x=>({...x,...(id==='uk'&&x.type==='side'?{correct:0,ex:'В Великобритании левостороннее движение. На обычной двусторонней дороге придерживайтесь левой стороны.'}:{})})).concat(extra[id]||[])}
const $=id=>document.getElementById(id);
let saved={};try{saved=JSON.parse(localStorage.getItem('worlddrive-v1')||'{}')||{}}catch{}
let country=countries.find(c=>c.id===saved.country)||countries[0],idx=0,score=0,chosen=null;
function save(){saved.country=country.id;saved[country.id]={idx,score,chosen};try{localStorage.setItem('worlddrive-v1',JSON.stringify(saved))}catch{}}
function load(){let s=saved[country.id]||{};idx=Number.isInteger(s.idx)?Math.max(0,Math.min(questions(country.id).length,s.idx)):0;score=Number.isInteger(s.score)?Math.max(0,Math.min(questions(country.id).length,s.score)):0;chosen=Number.isInteger(s.chosen)&&s.chosen>=0&&s.chosen<3?s.chosen:null;render()}
function car(x,y,angle,color){return '<g transform="translate('+x+' '+y+') rotate('+angle+')"><rect x="-14" y="-25" width="28" height="50" rx="9" fill="#172a28" opacity=".17" transform="translate(3 4)"/><rect x="-13" y="-24" width="26" height="48" rx="8" fill="'+color+'" stroke="#fff" stroke-width="1.5"/><rect x="-9" y="-13" width="18" height="10" rx="3" fill="#cbe6ee"/><rect x="-9" y="8" width="18" height="9" rx="2" fill="#36566a"/><path d="M-9 -22h5M4 -22h5" stroke="#fff7ce" stroke-width="3" stroke-linecap="round"/></g>'}
const line=(d,stroke='#f5f5e9',w=3,dash='')=>'<path d="'+d+'" fill="none" stroke="'+stroke+'" stroke-width="'+w+'" stroke-linecap="round" '+(dash?'stroke-dasharray="'+dash+'"':'')+'/>';
const road=(d,w)=>line(d,'#a9b6a3',w+12)+line(d,'#49545b',w);
const stopSign=(x,y)=>'<g transform="translate('+x+' '+y+')"><polygon points="-14,-33 14,-33 33,-14 33,14 14,33 -14,33 -33,14 -33,-14" fill="#ce4545" stroke="#fff" stroke-width="4"/><text y="5" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">STOP</text></g>';
const yieldSign=(x,y)=>'<g transform="translate('+x+' '+y+')"><path d="M-26 -17H26L0 29Z" fill="#fff" stroke="#d24444" stroke-width="6" stroke-linejoin="round"/></g>';
const noEntry=(x,y)=>'<g transform="translate('+x+' '+y+')"><circle r="37" fill="#d74444" stroke="white" stroke-width="3"/><rect x="-25" y="-7" width="50" height="14" rx="1" fill="white"/></g>';
function diagram(q,done){let left=country.side==='left',x=left?207:273,blue='#3b8fe8',red='#e56d60';let g='<defs><pattern id="grass" width="27" height="27" patternUnits="userSpaceOnUse"><circle cx="4" cy="5" r="1" fill="#93ae90" opacity=".3"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#8fe1ae"/></marker></defs><rect width="480" height="390" fill="#dce7d6"/><rect width="480" height="390" fill="url(#grass)"/>';
let route=(d)=>'<path class="route" d="'+d+'" stroke="#8fe1ae" stroke-width="5" fill="none" marker-end="url(#arrow)"/>';
if(['round','direction'].includes(q.type)){
g+=road('M240 390V300 M240 0V90 M0 195H135 M345 195H480',112);
g+='<circle cx="240" cy="195" r="111" fill="none" stroke="#a9b6a3" stroke-width="80"/><circle cx="240" cy="195" r="111" fill="none" stroke="#49545b" stroke-width="68"/><circle cx="240" cy="195" r="111" fill="none" stroke="#f5f5e9" stroke-width="2" stroke-dasharray="10 10"/><circle cx="240" cy="195" r="71" fill="#b8cfa9"/><circle cx="240" cy="195" r="45" fill="#a3bf97"/>';
g+=line('M240 390V310 M240 0V80 M0 195H100 M380 195H480','#f5f5e9',2,'10 10');
g+=line(left?'M184 319H239':'M241 319H296','#fff',4,'6 5');
g+=yieldSign(left?145:336,348)+car(x,354,0,blue);
if(q.type==='round')g+=car(left?343:137,240,left?140:40,red);
if(done)g+=route(left?'M207 312Q210 292 180 286A111 111 0 1 1 347 225':'M273 312Q270 292 300 286A111 111 0 1 0 133 225');
}else if(q.type==='entry'){
g+=road('M240 390V0',130)+line('M240 0V390','#fff',3,'13 12')+noEntry(240,125)+car(x,305,0,blue);
}else if(q.type==='side'||q.type==='wet'||q.type==='lanes'){
let multi=q.type==='lanes';g+=road('M240 0V390',multi?230:150);
g+=line('M240 0V390','#fff',multi?2:3,'14 12');
if(multi){g+=line('M182 0V390 M298 0V390','#fff',2,'12 12')+car(268,300,0,blue)+car(326,170,0,red);if(done)g+=route('M268 270Q268 220 326 220L326 70')}
else if(q.type==='wet'){g+=car(x,315,0,blue)+car(x,130,0,red);for(let i=0;i<24;i++){let a=(i*83)%460,b=(i*53)%370;g+=line('M'+a+' '+b+'l-7 15','#b9dfef',2)}}
else{g+=car(x,310,0,blue)+car(left?273:207,115,180,red);if(done)g+=route('M'+x+' 270V55')}
}else{
g+=road('M240 0V390 M0 165H480',136)+line('M240 0V90 M240 240V390 M0 165H165 M315 165H480','#f5f5e9',2,'12 10');
g+=line(left?'M176 248H238':'M242 248H304','#fff',4)+car(x,315,0,blue);
if(q.type==='stop'){g+=stopSign(left?128:352,270);if(done)g+=route('M'+x+' 240V65')}
if(q.type==='light'){g+='<g transform="translate('+(left?133:347)+' 255)"><rect x="-18" y="-43" width="36" height="86" rx="10" fill="#243335"/><circle cy="-25" r="10" fill="#fa6258"/><circle r="10" fill="#6b633b"/><circle cy="25" r="10" fill="#355b48"/></g>'}
if(q.type==='zebra'){for(let i=0;i<8;i++)g+='<rect x="'+(176+i*16)+'" y="208" width="10" height="30" fill="#fafbf2"/>';g+='<g transform="translate(254 222)" stroke="#f4b462" stroke-width="6" stroke-linecap="round"><circle cy="-14" r="7" fill="#f4b462" stroke="none"/><path d="M0 -5V9M-10 3L0 -2L10 3M0 9L-7 19M0 9L7 19"/></g>'}
}
return '<svg viewBox="0 0 480 390" role="img" aria-label="Учебная схема дорожной ситуации">'+g+'</svg>'}
function render(){const qs=questions(country.id),q=qs[idx];$('countries').innerHTML=countries.map(c=>'<button class="country '+(c.id===country.id?'active':'')+'" data-id="'+c.id+'" aria-pressed="'+(c.id===country.id)+'">'+c.label+'</button>').join('');$('countries').querySelectorAll('button').forEach(b=>b.onclick=()=>{country=countries.find(c=>c.id===b.dataset.id);load();save()});$('play').classList.toggle('hidden',!q);$('end').classList.toggle('hidden',!!q);if(!q){$('result').textContent=score+' / '+qs.length;$('endText').textContent=country.label+' · '+Math.round(score/qs.length*100)+'% правильных ответов';return}
$('count').textContent='Ситуация '+(idx+1)+' из '+qs.length;$('score').textContent='Верно: '+score;$('fill').style.width=((idx+(chosen!==null?1:0))/qs.length*100)+'%';document.querySelector('.track').setAttribute('aria-valuenow',Math.round((idx+(chosen!==null?1:0))/qs.length*100));$('topic').textContent=q.topic+' · '+(country.side==='left'?'левостороннее':'правостороннее движение');$('question').textContent=q.q;$('desc').textContent=q.d;$('legend').textContent=q.type==='entry'?'Дорожный знак':'Синяя машина — вы';$('diagram').innerHTML=diagram(q,chosen!==null);
$('answers').innerHTML='';q.a.forEach((a,i)=>{const b=document.createElement('button');b.className='answer'+(chosen!==null?(i===q.correct?' ok':i===chosen?' bad':''):'');b.disabled=chosen!==null;const s=document.createElement('span');s.className='letter';s.textContent='ABC'[i];b.append(s,document.createTextNode(a));b.onclick=()=>{if(chosen!==null)return;chosen=i;if(i===q.correct)score++;save();render();$('next').focus()};$('answers').append(b)});
const f=$('feedback');f.classList.toggle('hidden',chosen===null);f.classList.toggle('bad',chosen!==null&&chosen!==q.correct);if(chosen!==null){f.innerHTML='<strong>'+(chosen===q.correct?'✓ Верно!':'Не совсем')+'</strong>'+q.ex+' <a href="'+country.source+'" target="_blank" rel="noopener noreferrer">Официальные правила ↗</a>'}$('next').classList.toggle('hidden',chosen===null);$('next').textContent=idx===qs.length-1?'Посмотреть результат →':'Продолжить →'}
$('next').onclick=()=>{if(chosen===null)return;idx++;chosen=null;save();render();$('play').scrollIntoView({block:'nearest',behavior:'smooth'})};$('again').onclick=()=>{idx=score=0;chosen=null;save();render()};$('reset').onclick=()=>{if(!confirm('Сбросить прогресс во всех странах?'))return;saved={};idx=score=0;chosen=null;save();render()};load();
</script></html>
